<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" role="img" aria-labelledby="title description">
  <title id="title">Biomed Workbench research loop</title>
  <desc id="description">A single Codex entry discovers scientific modules, plans and executes analyses, applies quality gates, revises hypotheses, and produces publication deliverables.</desc>
  <rect width="1200" height="270" fill="#F7FAF9"/>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" letter-spacing="0">
    <text x="40" y="42" font-size="23" font-weight="700" fill="#172126">One entry. A complete scientific loop.</text>
    <text x="40" y="68" font-size="14" fill="#516068">Modules are discovered from contracts, composed from the question, and admitted only after scientific quality gates.</text>
    <g transform="translate(40 105)">
      <rect width="160" height="92" rx="6" fill="#172126"/>
      <text x="80" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Biomed Workbench</text>
      <text x="80" y="61" text-anchor="middle" font-size="12" fill="#D8E3E0">single Codex skill</text>
    </g>
    <g fill="none" stroke="#87959B" stroke-width="2">
      <path d="M210 151h34"/>
      <path d="m237 145 8 6-8 6"/>
      <path d="M414 151h34"/>
      <path d="m441 145 8 6-8 6"/>
      <path d="M618 151h34"/>
      <path d="m645 145 8 6-8 6"/>
      <path d="M822 151h34"/>
      <path d="m849 145 8 6-8 6"/>
      <path d="M1026 151h34"/>
      <path d="m1053 145 8 6-8 6"/>
      <path d="M937 208c0 39-269 40-269 3" stroke="#E05A47"/>
      <path d="m676 217-8-6 8-6" stroke="#E05A47"/>
    </g>
    <g transform="translate(244 105)">
      <rect width="170" height="92" rx="6" fill="#E5F3EF" stroke="#36A58B"/>
      <text x="85" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#172126">Discover</text>
      <text x="85" y="57" text-anchor="middle" font-size="12" fill="#516068">96 module contracts</text>
      <text x="85" y="75" text-anchor="middle" font-size="12" fill="#516068">inputs, tools, gates</text>
    </g>
    <g transform="translate(448 105)">
      <rect width="170" height="92" rx="6" fill="#FFF5DE" stroke="#E5B849"/>
      <text x="85" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#172126">Plan</text>
      <text x="85" y="57" text-anchor="middle" font-size="12" fill="#516068">single, serial, parallel</text>
      <text x="85" y="75" text-anchor="middle" font-size="12" fill="#516068">or mixed workflow</text>
    </g>
    <g transform="translate(652 105)">
      <rect width="170" height="92" rx="6" fill="#EAF2FA" stroke="#4388C7"/>
      <text x="85" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#172126">Execute</text>
      <text x="85" y="57" text-anchor="middle" font-size="12" fill="#516068">versioned tools</text>
      <text x="85" y="75" text-anchor="middle" font-size="12" fill="#516068">traceable artifacts</text>
    </g>
    <g transform="translate(856 105)">
      <rect width="170" height="92" rx="6" fill="#FCECE8" stroke="#E05A47"/>
      <text x="85" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#172126">Challenge</text>
      <text x="85" y="57" text-anchor="middle" font-size="12" fill="#516068">quality gates</text>
      <text x="85" y="75" text-anchor="middle" font-size="12" fill="#516068">hypothesis revision</text>
    </g>
    <g transform="translate(1060 105)">
      <rect width="100" height="92" rx="6" fill="#FFFFFF" stroke="#87959B"/>
      <text x="50" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#172126">Deliver</text>
      <text x="50" y="57" text-anchor="middle" font-size="12" fill="#516068">paper</text>
      <text x="50" y="75" text-anchor="middle" font-size="12" fill="#516068">review</text>
    </g>
    <text x="803" y="250" text-anchor="middle" font-size="12" font-weight="600" fill="#B44738">failed gates revise the plan and evidence state</text>
  </g>
</svg>
