name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  python-compatibility:
    name: Core contracts on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14.3"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up supported Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-compat.txt

      - name: Install cross-version contract dependencies
        run: python -m pip install --requirement requirements-compat.txt

      - name: Run core, contract, routing, and public-entry tests
        run: >-
          python -m pytest -q
          tests/unit/kernel
          tests/contract
          tests/unit/test_module_contract.py
          tests/unit/test_module_registry.py
          tests/test_routing.py
          tests/unit/test_research_plan.py
          tests/e2e/test_runner_cli.py
          tests/e2e/test_scientific_command_public_cli.py

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up tested Python baseline
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.3"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-compat.txt

      - name: Install verification dependencies
        run: >-
          python -m pip install
          --requirement requirements-ci.txt
          --requirement requirements-compat.txt

      - name: Install scientific verifier executables
        env:
          IQTREE3_VERSION: "3.1.2"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes mafft minimap2
          curl --fail --silent --show-error --location \
            "https://github.com/iqtree/iqtree3/releases/download/v${IQTREE3_VERSION}/iqtree-${IQTREE3_VERSION}-Linux.tar.gz" \
            --output "${RUNNER_TEMP}/iqtree3.tar.gz"
          tar -xzf "${RUNNER_TEMP}/iqtree3.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/iqtree-${IQTREE3_VERSION}-Linux/bin" >> "${GITHUB_PATH}"
          export PATH="${RUNNER_TEMP}/iqtree-${IQTREE3_VERSION}-Linux/bin:${PATH}"
          mafft --version >/dev/null
          minimap2 --version >/dev/null
          iqtree3 --version >/dev/null

      - name: Run complete test suite
        run: python -m unittest discover -s tests

      - name: Run pytest-style scientific and documentation contracts
        run: >-
          python -m pytest -q
          tests/unit/test_single_cell_advanced_integration.py
          tests/unit/test_spatial_deconvolution_expansion.py
          tests/unit/test_trajectory_spatial_visualization.py

      - name: Capture run-specific controlled-fixture receipts
        run: >-
          python tools/audit_execution_readiness.py
          --output "${RUNNER_TEMP}/execution-readiness-observed.json"
          --receipt-archive "${RUNNER_TEMP}/controlled-fixture-receipts"

      - name: Retain run-specific controlled-fixture receipts
        uses: actions/upload-artifact@v4
        with:
          name: controlled-fixture-receipts-${{ github.run_id }}
          path: ${{ runner.temp }}/controlled-fixture-receipts/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate release surface
        run: python tools/validate_workbench.py --release

      - name: Rebuild deterministic registry evidence
        run: |
          set -euo pipefail
          python tools/build_module_index.py
          python tools/build_format_contract_report.py --output reports/format-contract-registry.json
          python tools/build_tool_compatibility_matrix.py biomed_workbench/modules/builtin --output reports/tool-compatibility-matrix.json
          python tools/capture_compatibility_evidence.py --output reports/compatibility-execution-evidence.json
          python tools/audit_adapter_boundaries.py --output reports/adapter-boundary-audit.json
          python tools/verify_registry_snapshot.py --output reports/module-registry-verification.json
          python tools/verify_codex_native_handoffs.py --output reports/codex-native-handoff-verification.json
          python tools/verify_ci_quality.py --output reports/ci-quality-verification.json

      - name: Reject generated evidence drift
        run: git diff --exit-code

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Scan repository history without exposing findings
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1
